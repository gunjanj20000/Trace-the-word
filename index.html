<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Trace A Word - Word Tracing & Early Learning</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="description" content="A calm, gentle, sensory-friendly word tracing and early word learning app for children." />
    <meta name="theme-color" content="#0284c7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trace Words" />
    <meta name="format-detection" content="telephone=no" />
    
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts: Fredoka & Nunito for friendly rounded typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">

    <style>
      /* Prevent elastic bounce, pull to refresh, and accidental selection while tracing */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        background-color: #f8fafc;
        font-family: 'Fredoka', 'Nunito', system-ui, -apple-system, sans-serif;
      }

      /* iOS safe area utilities */
      .safe-top {
        padding-top: env(safe-area-inset-top, 0px);
      }
      .safe-bottom {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .safe-left {
        padding-left: env(safe-area-inset-left, 0px);
      }
      .safe-right {
        padding-right: env(safe-area-inset-right, 0px);
      }

      /* Non-draggable images */
      img {
        -webkit-user-drag: none;
        user-drag: none;
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-sky-50 via-indigo-50 to-purple-50 text-slate-800 antialiased selection:bg-none">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for offline PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('ServiceWorker registered with scope:', reg.scope);
            })
            .catch(err => {
              console.log('ServiceWorker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
